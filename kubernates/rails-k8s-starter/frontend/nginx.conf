# WHY WE ADD IT:
#   The final frontend image is nginx. This file tells nginx how to serve a React
#   app: send every unknown URL to index.html (React Router handles it), cache
#   built files for a long time, and answer /healthz so Kubernetes can check that
#   the pod is alive (used by the probes in k8s/32-frontend.yaml).
#
# WHAT IF YOU CHANGE THE APP NAME?
#   Nothing here uses the app name, so renaming the app changes nothing.
#   But if you rename the path `/healthz`, change `path:` in the two probes in
#   32-frontend.yaml as well. If they differ, the probe gets 404, the pod is never
#   "ready", and it is restarted again and again (CrashLoop / Not Ready).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: any unknown path (e.g. /orders/42) returns index.html,
  # and React Router decides what to show.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Built assets have content hashes in their names, so they can be cached for a year.
  # Vite puts them in /assets/. Create React App uses /static/ (change the path).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache index.html, so a new release is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Health check endpoint for the Kubernetes probes.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
