# Sidekiq keeps its job queues in Redis, so the app needs one.
# LEARNING / LOCAL ONLY: there is no persistent disk, so queued jobs are lost
# if this pod restarts. In production use a managed Redis (Amazon ElastiCache).
#
# WHY WE ADD IT:
#   This is the `redis:` service from your docker-compose.yml. Rails puts
#   background jobs (emails, reports) into Redis, and Sidekiq takes them out.
#   It is a Deployment (not StatefulSet) because we accept losing the data here.
#   The Service at the bottom gives it the name "redis".
#
# WHAT IF YOU CHANGE THE APP NAME?
#   - Service `name: redis` is the host name in REDIS_URL (01-configmap.yaml).
#     Example: rename the Service to `cache`. Then set
#     REDIS_URL: "redis://cache:6379/0". If you forget, Sidekiq logs
#     "Error connecting to Redis" and jobs never run.
#   - `app: redis` appears in the Deployment selector, the pod labels and the
#     Service selector. All must match. If the Service says `app: cache` but the
#     pod says `app: redis`, the Service has zero pods behind it (traffic goes nowhere).
#   - `namespace: myapp` must match the Namespace (see 00-namespace.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
# Gives Redis the stable DNS name "redis" (used in REDIS_URL in the ConfigMap).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: myapp
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
